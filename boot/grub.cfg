# grub.cfg - GRUB 2 config for arachnyaa OS

set timeout=0

set default=0


menuentry "arachnyaa OS" {
  multiboot /boot/arachnyaa_kernel
  module    /boot/initd  initd
  module    /boot/log-client log-client
  module    /boot/ttyd       ttyd
  module    /boot/procd      procd
  module    /boot/elfloader  elfloader
  module    /boot/ramfs      ramfs
  module    /boot/ramdiskd   ramdiskd
  module    /boot/atad       atad
  module    /boot/fatfs      fatfs
  module    /boot/vfs        vfs
  module    /boot/shell      shell
  module    /boot/echo       echo
  module    /boot/cat        cat
  module    /boot/ls         ls
  boot
}
